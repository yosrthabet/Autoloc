spring.application.name=ssa8

server.port=9090

#URL de connexion à la BDD MySQL :
spring.datasource.url=jdbc:mysql://Localhost:3306/AutoLocYosser?createDatabaseIfNotExist=true
#Nom d'utilisateur MySQL
spring.datasource.username=root
#Mot de passe MySQL
spring.datasource.password=


#Affiche les requêtes SQL générées en console
spring.jpa.show-sql=true
#Stratégie de génération des tables : update
spring.jpa.hibernate.ddl-auto=update